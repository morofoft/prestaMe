<html lang="es">

<head>
  <meta charset="utf-8" />

  <title>PrestaMe</title>

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">


  <!-- ⬇️ FAVICONS -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 130 130'%3E%3Crect width='130' height='130' rx='26' fill='%232563eb'/%3E%3Cg fill='%23fff' transform='translate(26.55,15) scale(0.7692)'%3E%3Crect x='0' y='0' width='18' height='130' rx='4'/%3E%3Crect x='26' y='0' width='18' height='70' rx='4'/%3E%3Crect x='52' y='0' width='18' height='130' rx='4'/%3E%3Crect x='78' y='0' width='18' height='38' rx='4'/%3E%3Crect x='78' y='68' width='18' height='62' rx='4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: { extend: { colors: { primary: '#2563eb' } } }
    }
  </script>

  <!-- ⬇️ AQUÍ VA TODO LO QUE USA @apply (sí funciona con Play CDN) -->
  <style type="text/tailwindcss">
    @layer components {
/* ── Grid utilitario (KPIs + pares de campos) ─ */
.gridk {
  @apply grid grid-cols-2 gap-2.5;
}

/* Solo el grid de KPIs del dashboard recibe margen inferior
   y pasa a 3 columnas en pantallas anchas */
.gridk:has(> .kpi) {
  @apply mb-3;
}
@media (min-width: 560px) {
  .gridk:has(> .kpi) {
    @apply grid-cols-3;
  }
}
  /* ── Cards ─────────────────────────────────── */
  .card { @apply bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm mb-3; }

  /* ── KPIs ──────────────────────────────────── */
  .kpi { @apply bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3.5 shadow-sm; }
  .kpi .lbl { @apply text-[11.5px] font-bold uppercase tracking-wide text-slate-500 dark:text-slate-400; }
  .kpi .val { @apply text-xl font-extrabold mt-1 tracking-tight tabular-nums text-slate-900 dark:text-slate-100; }
  .kpi.pri  .val { @apply text-blue-600 dark:text-blue-400; }
  .kpi.ok   .val { @apply text-green-600 dark:text-green-400; }
  .kpi.bad  .val { @apply text-red-600 dark:text-red-400; }
  .kpi.warn .val { @apply text-amber-600 dark:text-amber-400; }

  /* ── Tags ──────────────────────────────────── */
  .tag { @apply inline-block text-[11px] font-bold px-2 py-0.5 rounded-full; }
  .tag.activo   { @apply bg-blue-100 text-blue-700 dark:bg-blue-950/60 dark:text-blue-300; }
  .tag.pagado   { @apply bg-green-100 text-green-700 dark:bg-green-950/60 dark:text-green-300; }
  .tag.atrasado { @apply bg-red-100 text-red-700 dark:bg-red-950/60 dark:text-red-300; }

  /* ── Filas / KVs ───────────────────────────── */
  .row { @apply flex items-center justify-between gap-2.5; }
  .row.wrap { @apply flex-wrap; }
  .kv { @apply flex justify-between gap-2.5 py-2 border-b border-dashed border-slate-200 dark:border-slate-800 text-sm text-slate-700 dark:text-slate-300; }
  .kv b { @apply tabular-nums font-bold text-slate-900 dark:text-slate-100; }
  .kv.bad b { @apply text-red-600 dark:text-red-400; }

  /* ── Pills (filtros) ───────────────────────── */
  .pill { @apply flex gap-1.5 overflow-x-auto pb-1 mb-2.5; }
  .pill button { @apply border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-500 dark:text-slate-400 rounded-full px-3.5 py-1.5 text-xs font-semibold whitespace-nowrap min-h-[38px] transition; }
  .pill button.on { @apply bg-blue-600 border-blue-600 text-white; }

  /* ── Inputs / botones ──────────────────────── */
  .search { @apply w-full p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 mb-2.5 text-base focus:outline-none focus:ring-2 focus:ring-blue-500; }
  .btn { @apply border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-[44px] px-4 py-2.5 rounded-xl font-semibold transition active:scale-95 inline-flex items-center justify-center gap-1.5 text-sm; }
  .btn.primary { @apply bg-blue-600 border-blue-600 text-white hover:bg-blue-700; }
  .btn.ok      { @apply bg-green-600 border-green-600 text-white hover:bg-green-700; }
  .btn.danger  { @apply bg-red-600 border-red-600 text-white hover:bg-red-700; }
  .btn.ghost   { @apply bg-transparent border-transparent text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800; }
  .btn.sm      { @apply min-h-[36px] px-3 py-1.5 text-xs rounded-lg; }

  /* ── Avatares ──────────────────────────────── */
  .avatar { @apply w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center font-bold text-sm shrink-0 object-cover; }

  /* ── Recordatorios ─────────────────────────── */
  .remind-item { @apply flex items-center gap-2.5 py-2.5 border-b border-slate-200 dark:border-slate-800; }
  .remind-item .info { @apply flex-1 min-w-0; }
  .remind-item .actions { @apply flex gap-1.5 items-center shrink-0; }
  .iconAction { @apply w-9 h-9 rounded-full border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex items-center justify-center text-slate-800 dark:text-slate-200 text-base no-underline active:bg-slate-100 dark:active:bg-slate-800; }
  .iconAction.wa { @apply bg-emerald-500 border-emerald-500 text-white dark:bg-emerald-600 dark:border-emerald-600; }

  /* ── Modal ─────────────────────────────────── */
  .modal-head { @apply flex justify-between items-center gap-3 p-4 pb-2 shrink-0 border-b border-slate-100 dark:border-slate-800; }
  .modal-head h2 { @apply text-lg font-bold truncate flex-1; }
  .modal-body { @apply p-4 pt-3 overflow-y-auto flex-1; }
  .modal-foot { @apply p-4 pt-3 pb-[calc(14px+env(safe-area-inset-bottom))] shrink-0 flex gap-2 justify-end border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900; }

  /* ── Formularios ───────────────────────────── */
  .form label { @apply block text-xs font-bold text-slate-500 dark:text-slate-400 mb-3; }
  .form input, .form select, .form textarea { @apply w-full mt-1.5 p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-medium text-base focus:outline-none focus:ring-2 focus:ring-blue-500; }

  .preview { @apply bg-blue-50 dark:bg-blue-950/40 border border-dashed border-blue-200 dark:border-blue-900 rounded-xl p-3 my-2 text-xs text-slate-700 dark:text-slate-300; }

  /* ── Cuotas ────────────────────────────────── */
  .cuota { @apply flex justify-between text-xs py-2 border-b border-slate-200 dark:border-slate-800 tabular-nums text-slate-700 dark:text-slate-300; }

  /* ── Swipe cards ───────────────────────────── */
  .swipe-wrap { @apply relative overflow-hidden rounded-2xl mb-3; }
  .swipe-actions { @apply absolute inset-0 flex justify-end; }
  .swipe-actions button { @apply border-0 text-white font-bold text-xs px-4 min-w-[80px] flex flex-col items-center justify-center gap-1; }
  .swipe-actions .edit { @apply bg-amber-500; }
  .swipe-actions .pay  { @apply bg-green-600; }
  .swipe-card { @apply relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm transition-transform duration-200 ease-out select-none; }
  .swipe-card.dragging { @apply transition-none; }  /* ⬅️ fix: evita lag al arrastrar */

  /* ── Chart ─────────────────────────────────── */
  .chart { @apply w-full h-auto block; }
  .legend { @apply flex gap-3 text-xs text-slate-500 dark:text-slate-400 mt-2; }
  .dot { @apply w-2.5 h-2.5 rounded-sm inline-block mr-1; }

  /* ── Misc ──────────────────────────────────── */
  .empty { @apply text-center py-7 px-2 text-slate-500 dark:text-slate-400 text-sm; }
  #toast.show { @apply opacity-100 translate-y-0 pointer-events-auto; }
  nav.tabs button.on { @apply text-blue-600 dark:text-blue-400; }

  /* ── Badge de atrasados en el tab ──────────── */
  .tab-badge {
    @apply absolute top-1 right-[calc(50%-24px)] min-w-[18px] h-[18px] px-1 rounded-full
           bg-red-500 text-white text-[10px] font-bold flex items-center justify-center
           leading-none shadow-md pointer-events-none;
  }
}
</style>

  <link rel="stylesheet" href="./css/main.css">
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body
  class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased h-full overscroll-y-none">

  <!-- LOCK (sin cambios) -->
  <div id="lock"
    class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-[radial-gradient(1200px_500px_at_50%_-10%,rgba(37,99,235,.22),transparent)] bg-slate-100 dark:bg-slate-950">
    <div class="w-full max-w-[340px] text-center">
      <div class="flex justify-center mb-1">
        <svg class="w-16 h-20 animate-svg-rainbow" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <g>
            <rect x="0" y="0" width="18" height="130" rx="4" />
            <rect x="26" y="0" width="18" height="70" rx="4" />
            <rect x="52" y="0" width="18" height="130" rx="4" />
            <rect x="78" y="0" width="18" height="38" rx="4" />
            <rect x="78" y="68" width="18" height="62" rx="4" />
          </g>
        </svg>
      </div>
      <h1 class="mt-2 text-xl font-bold">PrestaMe</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm" id="lockMsg">Ingresa tu PIN</p>
      <input id="pin1" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" maxlength="8"
        class="w-full mt-2.5 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-center tracking-[8px] text-xl font-bold text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <input id="pin2" type="password" inputmode="numeric" autocomplete="off" placeholder="Repite el PIN" maxlength="8"
        class="hidden w-full mt-2.5 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-center tracking-[8px] text-xl font-bold text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <button class="btn primary block w-full mt-3.5 py-3.5 px-4" id="lockBtn">Entrar</button>
      <p class="text-xs text-slate-400 dark:text-slate-500 mt-3.5">Los datos se guardan solo en este dispositivo.</p>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <header
      class="sticky top-0 z-20 flex items-center justify-between gap-2.5 px-3.5 pt-[calc(10px+env(safe-area-inset-top))] pb-2.5 bg-slate-100/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
      <div class="font-extrabold tracking-tight text-sm flex items-center gap-1.5">
        <svg class="w-5 h-6 animate-svg-rainbow" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true">
          <g>
            <rect x="0" y="0" width="18" height="130" rx="4" />
            <rect x="26" y="0" width="18" height="70" rx="4" />
            <rect x="52" y="0" width="18" height="130" rx="4" />
            <rect x="78" y="0" width="18" height="38" rx="4" />
            <rect x="78" y="68" width="18" height="62" rx="4" />
          </g>
        </svg>
        PrestaMe
      </div>
      <div class="flex gap-1.5">
        <button class="btn icon min-h-[44px] min-w-[44px] p-2 text-lg" onclick="ciclarTema()" id="btnTema"
          aria-label="Cambiar tema"><i class="fa-solid fa-circle-half-stroke"></i></button>
        <button class="btn icon min-h-[44px] min-w-[44px] p-2 text-lg" onclick="lockApp()" aria-label="Bloquear"><i
            class="fas fa-lock"></i></button>
      </div>
    </header>

    <main id="view" class="p-3.5 pb-[calc(64px+24px+env(safe-area-inset-bottom))] max-w-[900px] mx-auto"></main>

    <button
      class="fab fixed right-4 bottom-[calc(64px+16px+env(safe-area-inset-bottom))] w-[58px] h-[58px] rounded-full border-none bg-blue-600 text-white text-3xl font-light leading-none shadow-[0_10px_26px_rgba(37,99,235,.45),0_2px_6px_rgba(37,99,235,.3)] z-30 flex items-center justify-center transition active:scale-95"
      id="fab" onclick="toggleFab(event)" aria-label="Acciones">+</button>

<div class="hidden fixed right-4 bottom-[calc(64px+84px+env(safe-area-inset-bottom))] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl p-1.5 z-30 min-w-[220px]" id="fabMenu">
  <button class="flex items-center gap-3 w-full p-3 bg-transparent text-slate-900 dark:text-slate-100 rounded-xl font-semibold text-base text-left min-h-[48px] active:bg-blue-50 dark:active:bg-blue-950/30" onclick="fabAction('prestamo')">
    <i class="fa-solid fa-file-invoice-dollar w-6 text-center text-xl text-blue-600"></i> Nuevo préstamo
  </button>
  <button class="flex items-center gap-3 w-full p-3 bg-transparent text-slate-900 dark:text-slate-100 rounded-xl font-semibold text-base text-left min-h-[48px] active:bg-blue-50 dark:active:bg-blue-950/30" onclick="fabAction('persona')">
    <i class="fa-solid fa-user-plus w-6 text-center text-xl text-emerald-600"></i> Nueva persona
  </button>
  <button class="flex items-center gap-3 w-full p-3 bg-transparent text-slate-900 dark:text-slate-100 rounded-xl font-semibold text-base text-left min-h-[48px] active:bg-blue-50 dark:active:bg-blue-950/30" onclick="fabAction('pago')">
    <i class="fa-solid fa-hand-holding-dollar w-6 text-center text-xl text-green-600"></i> Registrar pago
  </button>
</div>

    <nav
      class="tabs fixed left-0 right-0 bottom-0 z-20 grid grid-cols-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 pb-[env(safe-area-inset-bottom)] h-[calc(64px+env(safe-area-inset-bottom))]">
      <button
        class="relative flex flex-col items-center justify-center gap-0.5 p-2 text-[10.5px] text-slate-500 dark:text-slate-400 font-semibold h-[64px]"
        data-tab="panel" onclick="setTab('panel')"><i
          class="fa-solid fa-chart-line text-xl leading-none"></i><span>Panel</span></button>
      <button
        class="relative flex flex-col items-center justify-center gap-0.5 p-2 text-[10.5px] text-slate-500 dark:text-slate-400 font-semibold h-[64px]"
        data-tab="prestamos" onclick="setTab('prestamos')"><i
          class="fa-solid fa-file-invoice-dollar text-xl leading-none"></i><span>Préstamos</span></button>
      <button
        class="relative flex flex-col items-center justify-center gap-0.5 p-2 text-[10.5px] text-slate-500 dark:text-slate-400 font-semibold h-[64px]"
        data-tab="personas" onclick="setTab('personas')"><i
          class="fa-solid fa-users text-xl leading-none"></i><span>Personas</span></button>
      <button
        class="relative flex flex-col items-center justify-center gap-0.5 p-2 text-[10.5px] text-slate-500 dark:text-slate-400 font-semibold h-[64px]"
        data-tab="ajustes" onclick="setTab('ajustes')"><i
          class="fa-solid fa-gear text-xl leading-none"></i><span>Ajustes</span></button>
    </nav>
  </div>

  <div id="modal"
    class="hidden fixed inset-0 z-40 bg-slate-950/55 flex items-end sm:items-center justify-center backdrop-blur-sm"
    onclick="if(event.target===this)closeModal()">
    <div
      class="bg-white dark:bg-slate-900 w-full max-w-[560px] max-h-[92vh] sm:max-h-[88vh] flex flex-col rounded-t-[20px] sm:rounded-[20px] overflow-hidden"
      id="modalBox"></div>
  </div>

  <div id="print-area"></div>

  <script src="./js/main.js"></script>
</body>

</html>
